# Pipeline reutilizable de LogiTrack. Cada microservicio lo invoca con `uses:` (workflow_call):
# cambiar el proceso aquí lo cambia en los 8 repositorios a la vez.
#
#   test   → lint, pruebas (pytest), dependencias vulnerables y secretos filtrados
#   docker → needs: test.   Solo en main: construye la imagen y la publica en GHCR (etiqueta = SHA del commit)
#   deploy → needs: docker. Dispara el despliegue en Render con el deploy hook del servicio y verifica /ready
name: pipeline-microservicio

on:
  workflow_call:
    inputs:
      service-name:
        description: Carpeta del microservicio (fleet, shipment, ...)
        type: string
        required: true
      imagen:
        description: Imagen en GHCR, sin etiqueta (ghcr.io/kevinso4/logitrack-fleet)
        type: string
        required: true
      directorio:
        description: Carpeta que contiene common/, el servicio, requirements.txt y Dockerfile
        type: string
        default: "."
      desplegar:
        description: false en el repositorio de integración (solo prueba y publica la imagen)
        type: boolean
        default: true
      url:
        description: URL pública del servicio desplegado
        type: string
        default: ""
      render-service-id:
        description: Id del servicio en Render (srv-...). Evita desplegar con el hook de otro servicio
        type: string
        default: ""
    secrets:
      RENDER_DEPLOY_HOOK:
        description: URL secreta que redespliega el servicio en Render
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.directorio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks revisa toda la historia
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.directorio }}/requirements.txt
      - name: Dependencias
        run: pip install -r requirements.txt pytest ruff pip-audit
      - name: Lint
        run: ruff check --select F,E9,B --ignore B008,B904 common ${{ inputs.service-name }}
      - name: Pruebas
        run: python -m pytest -q ${{ inputs.service-name }}/tests
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
      - name: Secretos filtrados en el código
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # token temporal del propio workflow: no hay contraseña que guardar
      - name: Construir y publicar la imagen (SHA del commit + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.directorio }}
          build-args: SERVICE=${{ inputs.service-name }}
          push: true
          tags: |
            ${{ inputs.imagen }}:${{ github.sha }}
            ${{ inputs.imagen }}:latest

  deploy:
    needs: docker
    if: inputs.desplegar
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.url }}
    steps:
      - name: Disparar el despliegue en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK (Settings › Secrets and variables › Actions)"
            exit 1
          fi
          # La URL del hook contiene el id del servicio: si no coincide, se guardó el hook de otro servicio.
          SERVICIO="${{ inputs.render-service-id }}"
          if [ -n "$SERVICIO" ] && [[ "$HOOK" != *"/$SERVICIO?"* ]]; then
            echo "::error::RENDER_DEPLOY_HOOK no pertenece a $SERVICIO: se guardó el hook de otro servicio"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Despliegue solicitado para ${{ inputs.service-name }} (commit ${{ github.sha }})"
      - name: Verificar que el servicio responde
        if: inputs.url != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 "${{ inputs.url }}/ready"; then echo; exit 0; fi
            sleep 20
          done
          echo "::error::${{ inputs.url }}/ready no respondió"; exit 1
